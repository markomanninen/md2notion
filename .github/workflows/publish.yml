name: publish

# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted
# publishing: the md2notionpage project on PyPI must trust this repository, workflow
# file publish.yml and environment pypi.

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
